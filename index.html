<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Genshin Spire</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; }
#load-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: #1a1a2e; color: #fff; z-index: 9999; font-family: 'Segoe UI', Arial, sans-serif;
}
#load-overlay h1 { font-size: 28px; margin-bottom: 30px; color: #c8a0ff; text-shadow: 0 0 10px rgba(200,160,255,0.5); }
#pbox { width: 60%; max-width: 500px; }
#pbar-bg { width: 100%; height: 24px; background: #333; border-radius: 12px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
#pbar { width: 0%; height: 100%; background: linear-gradient(90deg, #7c3aed, #c084fc); border-radius: 12px; transition: width 0.3s ease; }
#ptxt { margin-top: 12px; font-size: 14px; color: #999; text-align: center; }
</style>
</head>
<body>

<div id="load-overlay">
    <h1>Genshin Spire</h1>
    <div id="pbox">
        <div id="pbar-bg"><div id="pbar"></div></div>
        <div id="ptxt">正在準備下載...</div>
    </div>
</div>

<script>
// Monkey-patch fetch to show download progress
var _origFetch = window.fetch;
var _apkSize = 34603008;
window.fetch = function() {
    return _origFetch.apply(this, arguments).then(function(resp) {
        var url = arguments[0];
        if (typeof url === 'string' && url.indexOf('.apk') >= 0) {
            var clone = resp.clone();
            var reader = clone.body.getReader();
            var received = 0;
            var bar = document.getElementById('pbar');
            var txt = document.getElementById('ptxt');

            function pump() {
                return reader.read().then(function(result) {
                    if (result.done) return;
                    received += result.value.length;
                    var pct = Math.round((received / _apkSize) * 100);
                    var mb = (received / 1048576).toFixed(1);
                    var total = (_apkSize / 1048576).toFixed(1);
                    bar.style.width = pct + '%';
                    txt.textContent = mb + ' / ' + total + ' MB (' + pct + '%)';
                    return pump();
                });
            }
            pump();

            // Hide overlay after small delay when game starts
            setTimeout(function() {
                var ov = document.getElementById('load-overlay');
                if (ov) { ov.style.transition = 'opacity 0.5s'; ov.style.opacity = '0'; setTimeout(function() { ov.style.display = 'none'; }, 500); }
            }, 5000);
        }
        return resp;
    });
};
</script>

<script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js"
    type="module" id="site" data-python="python3.12"
    data-LINES=42 data-COLUMNS=132 data-os="vtx,snd,gui" async defer>#<!--

print("""
Loading genshin-tower-main from genshin-tower-main.apk
    Pygbag Version : 0.9.3
""")
#--></script>
</body>
</html>
