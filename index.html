<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Genshin Spire</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; }
#load-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: #1a1a2e; color: #fff; z-index: 9999; font-family: 'Segoe UI', Arial, sans-serif;
}
#load-overlay h1 { font-size: 28px; margin-bottom: 30px; color: #c8a0ff; text-shadow: 0 0 10px rgba(200,160,255,0.5); }
#pbox { width: 60%; max-width: 500px; }
#pbar-bg { width: 100%; height: 24px; background: #333; border-radius: 12px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
#pbar { width: 0%; height: 100%; background: linear-gradient(90deg, #7c3aed, #c084fc); border-radius: 12px; transition: width 0.1s linear; }
#ptxt { margin-top: 12px; font-size: 14px; color: #999; text-align: center; }
</style>
</head>
<body>

<div id="load-overlay">
    <h1>Genshin Spire</h1>
    <div id="pbox">
        <div id="pbar-bg"><div id="pbar"></div></div>
        <div id="ptxt">正在載入遊戲...</div>
    </div>
</div>

<script>
var bar = document.getElementById('pbar');
var txt = document.getElementById('ptxt');
var ov = document.getElementById('load-overlay');
var startTime = Date.now();
var totalMs = 60000;

var progressTimer = setInterval(function() {
    var elapsed = Date.now() - startTime;
    var pct = Math.round((elapsed / totalMs) * 100);
    if (pct > 95) pct = 95;
    bar.style.width = pct + '%';
    var sec = Math.round(elapsed / 1000);
    txt.textContent = '正在載入遊戲... (' + sec + '秒)';
}, 200);

var hideTimer = setInterval(function() {
    if (document.querySelector('canvas')) {
        clearInterval(progressTimer);
        clearInterval(hideTimer);
        bar.style.width = '100%';
        txt.textContent = '載入完成！';
        setTimeout(function() {
            ov.style.transition = 'opacity 0.5s';
            ov.style.opacity = '0';
            setTimeout(function() { ov.style.display = 'none'; }, 500);
        }, 300);
    }
}, 300);
</script>

<script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js"
    type="module" id="site" data-python="python3.12"
    data-LINES=42 data-COLUMNS=132 data-os="vtx,snd,gui" async defer>#<!--

print("""
Loading genshin-tower-main from genshin-tower-main.apk
    Pygbag Version : 0.9.3
""")
#--></script>
</body>
</html>
