import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#1a1a2e"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"

    bundle = "genshin-tower-main"

    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("genshin-tower-main.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("genshin-tower-main.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)

    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    var bar = document.getElementById('pbar');
    var txt = document.getElementById('ptxt');
    var ov = document.getElementById('load-overlay');
    var startTime = Date.now();
    var totalMs = 90000;

    var progressTimer = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var pct = Math.round((elapsed / totalMs) * 100);
        if (pct > 95) pct = 95;
        bar.style.width = pct + '%';
        var sec = Math.round(elapsed / 1000);
        txt.textContent = '正在載入遊戲... (' + sec + '秒)';
    }, 200);

    function hideOverlay() {
        clearInterval(progressTimer);
        bar.style.width = '100%';
        txt.textContent = '載入完成！';
        setTimeout(function() {
            ov.style.transition = 'opacity 0.5s';
            ov.style.opacity = '0';
            setTimeout(function() { ov.style.display = 'none'; }, 500);
        }, 300);
    }

    var hideTimer = setInterval(function() {
        if (document.querySelector('canvas')) {
            var canvas = document.querySelector('canvas');
            if (canvas.width > 10) {
                clearInterval(hideTimer);
                hideOverlay();
            }
        }
    }, 500);

    setTimeout(function() {
        clearInterval(hideTimer);
        hideOverlay();
    }, 120000);
